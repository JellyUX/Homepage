name: Weekly Jellyfin Web drift

# The drift job of ci.yml checks the validated bundle of each Jellyfin line on each push; this one checks
# the newest published image of each line every week, so a new Jellyfin release that renames a hooked
# token shows up before a user reports it (CONTRIBUTING.md "Jellyfin Update Procedure").
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Jellyfin Web drift (newest ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: '10.11'
            sdk: '10.11.9'
            dotnet: 9.0.x
          - image: '12'
            sdk: '12.0.0'
            dotnet: 10.0.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Extract jellyfin-web from jellyfin/jellyfin:${{ matrix.image }}
        run: |
          docker pull jellyfin/jellyfin:${{ matrix.image }}
          docker create --name jf-drift-extract jellyfin/jellyfin:${{ matrix.image }}
          docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' jf-drift-extract
          WEB_DIR=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' jf-drift-extract | grep '^JELLYFIN_WEB_DIR=' | cut -d= -f2)
          docker cp "jf-drift-extract:$WEB_DIR" ./jellyfin-web-extract
          docker rm jf-drift-extract
          echo "JELLYFIN_WEB_EXTRACT_PATH=$PWD/jellyfin-web-extract" >> "$GITHUB_ENV"

      - name: Restore & build
        run: |
          dotnet restore -p:JellyfinVersion=${{ matrix.sdk }}
          dotnet build --configuration Release --no-restore -p:JellyfinVersion=${{ matrix.sdk }}

      - name: Run the drift checks
        run: dotnet test --no-build --configuration Release -p:JellyfinVersion=${{ matrix.sdk }} --filter "Category=RequiresDocker"
