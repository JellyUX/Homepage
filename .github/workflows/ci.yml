name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The coverage summary diffs against the push or pull request base.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=RequiresDocker" --collect:"XPlat Code Coverage" --results-directory coverage/cs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --coverage

      - name: Summarize coverage
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node ci/coverage-summary.mjs "$(find coverage/cs -name coverage.cobertura.xml | head -1)" coverage/js/coverage-summary.json --diff-base "$DIFF_BASE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 14

  build-newest-abi:
    name: Build against the newest validated Jellyfin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # The published build targets the declared minimum (build.yaml targetAbi); this one checks the
      # code still compiles against the newest server the plugin is validated on.
      - name: Build against Jellyfin 10.11.10
        run: dotnet build src/Jellyfin.Plugin.JuxHomepage/Jellyfin.Plugin.JuxHomepage.csproj --configuration Release -p:JellyfinVersion=10.11.10

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      # Commits checked: those of the pull request, or those of the push (the last one alone when
      # the push has no usable "before", e.g. a new branch).
      - name: Run static checks
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$HEAD_SHA~1"
          fi
          node ci/static-checks.mjs --commits "$BEFORE..$HEAD_SHA"

      - name: Check the client asset budget
        run: node ci/asset-budget.mjs

  e2e:
    name: End-to-end (Jellyfin ${{ matrix.jellyfin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared minimum (build.yaml targetAbi) and the newest validated server.
        jellyfin: ['10.11.9', '10.11.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Build the plugin
        run: dotnet build src/Jellyfin.Plugin.JuxHomepage/Jellyfin.Plugin.JuxHomepage.csproj --configuration Release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the Jellyfin bench
        run: node e2e/setup.mjs up --image jellyfin/jellyfin:${{ matrix.jellyfin }}

      - name: Run the browser tests
        run: npx playwright test -c e2e --project root

      - name: Move the server under a BaseUrl
        run: node e2e/setup.mjs base-url /jf

      - name: Run the BaseUrl browser tests
        run: npx playwright test -c e2e --project baseurl

      - name: Dump the Jellyfin log
        if: failure()
        run: docker logs jux-e2e > e2e/.work/jellyfin.log 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report-${{ matrix.jellyfin }}
          path: |
            e2e/.work/report
            e2e/.work/results
            e2e/.work/jellyfin.log
          retention-days: 14

  drift:
    name: Jellyfin Web drift (10.11.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # The bundle the HookCardBuilder constant and Web/jux-native-selectors.json are validated for.
      - name: Extract jellyfin-web from jellyfin/jellyfin:10.11.10
        run: |
          docker create --name jf-drift-extract jellyfin/jellyfin:10.11.10
          WEB_DIR=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' jf-drift-extract | grep '^JELLYFIN_WEB_DIR=' | cut -d= -f2)
          docker cp "jf-drift-extract:$WEB_DIR" ./jellyfin-web-extract
          docker rm jf-drift-extract
          echo "JELLYFIN_WEB_EXTRACT_PATH=$PWD/jellyfin-web-extract" >> "$GITHUB_ENV"

      - name: Restore & build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run the drift checks
        run: dotnet test --no-build --configuration Release --filter "Category=RequiresDocker"

  release:
    name: Release
    needs: [build-test, build-newest-abi, static, e2e, drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install JPRM
        run: pip install jprm

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
