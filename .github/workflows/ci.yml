name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The coverage summary diffs against the push or pull request base.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=RequiresDocker" --collect:"XPlat Code Coverage" --results-directory coverage/cs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --coverage

      # Same base as the static checks: a manual run or a new branch diffs against origin/main (A-03.d).
      - name: Summarize coverage
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node ci/coverage-summary.mjs "$(find coverage/cs -name coverage.cobertura.xml | head -1)" coverage/js/coverage-summary.json --diff-base "$(node ci/push-base.mjs)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 14

  build-newest-abi:
    name: Build against the newest validated Jellyfin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # The published build targets the declared minimum (build.yaml targetAbi); this one checks the
      # code still compiles against the newest server the plugin is validated on.
      - name: Build against Jellyfin 10.11.10
        run: dotnet build src/Jellyfin.Plugin.JuxHomepage/Jellyfin.Plugin.JuxHomepage.csproj --configuration Release -p:JellyfinVersion=10.11.10

  commits:
    name: Build every commit of the push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # HEAD gets the full suites in the other jobs; each earlier commit of the push is built and runs
      # Vitest, so no intermediate commit ships broken (TODO_V5 Clôture.c, CONTRIBUTING.md "Change Checklist").
      - name: Build and unit-test each commit before HEAD
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          BASE=$(node ci/push-base.mjs)
          FAILED=""
          LOCK=""
          for SHA in $(git rev-list --reverse "$BASE..$HEAD_SHA~1"); do
            echo "::group::$(git log -1 --format='%h %s' "$SHA")"
            git checkout -q --detach "$SHA"
            if [ "$(git rev-parse "$SHA:package-lock.json")" != "$LOCK" ]; then
              npm ci --no-audit --no-fund >/dev/null
              LOCK=$(git rev-parse "$SHA:package-lock.json")
            fi
            if dotnet build --configuration Release && npx vitest run; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$(git log -1 --format='%h %s' "$SHA") does not build or fails Vitest"
              FAILED="$FAILED $SHA"
            fi
          done
          git checkout -q --detach "$HEAD_SHA"
          [ -z "$FAILED" ]

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      # Commits checked: those of the pull request or of the push; without a usable "before" (manual run,
      # new branch), those since the merge base with origin/main (ci/push-base.mjs).
      - name: Run static checks
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node ci/static-checks.mjs --commits "$(node ci/push-base.mjs)..$HEAD_SHA"

      # Each check runs even when an earlier one failed, so one run reports every broken gate.
      - name: Check the client asset budget
        if: ${{ !cancelled() }}
        run: node ci/asset-budget.mjs

      - name: Check for dead code
        if: ${{ !cancelled() }}
        run: node ci/dead-code.mjs

  e2e:
    name: End-to-end (Jellyfin ${{ matrix.jellyfin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared minimum (build.yaml targetAbi) and the newest validated server.
        jellyfin: ['10.11.9', '10.11.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Build the plugin
        run: dotnet build src/Jellyfin.Plugin.JuxHomepage/Jellyfin.Plugin.JuxHomepage.csproj --configuration Release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the Jellyfin bench
        run: node e2e/setup.mjs up --image jellyfin/jellyfin:${{ matrix.jellyfin }}

      - name: Run the browser tests
        run: npx playwright test -c e2e --project root --project mobile

      - name: Move the server under a BaseUrl
        run: node e2e/setup.mjs base-url /jf

      - name: Run the BaseUrl browser tests
        run: npx playwright test -c e2e --project baseurl

      - name: Load a configuration saved by the 2.13.0 release
        run: node e2e/setup.mjs load-config e2e/fixtures/config-2.13.0.xml

      - name: Run the configuration upgrade browser test
        run: npx playwright test -c e2e --project legacy-config

      - name: Dump the Jellyfin log
        if: failure()
        run: docker logs jux-e2e > e2e/.work/jellyfin.log 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report-${{ matrix.jellyfin }}
          path: |
            e2e/.work/report
            e2e/.work/results
            e2e/.work/jellyfin.log
          retention-days: 14

  drift:
    name: Jellyfin Web drift (10.11.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # The bundle the HookCardBuilder constant and Web/jux-native-selectors.json are validated for.
      - name: Extract jellyfin-web from jellyfin/jellyfin:10.11.10
        run: |
          docker create --name jf-drift-extract jellyfin/jellyfin:10.11.10
          WEB_DIR=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' jf-drift-extract | grep '^JELLYFIN_WEB_DIR=' | cut -d= -f2)
          docker cp "jf-drift-extract:$WEB_DIR" ./jellyfin-web-extract
          docker rm jf-drift-extract
          echo "JELLYFIN_WEB_EXTRACT_PATH=$PWD/jellyfin-web-extract" >> "$GITHUB_ENV"

      - name: Restore & build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run the drift checks
        run: dotnet test --no-build --configuration Release --filter "Category=RequiresDocker"

  release:
    name: Release
    needs: [build-test, build-newest-abi, commits, static, e2e, drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install JPRM
        run: pip install jprm

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
