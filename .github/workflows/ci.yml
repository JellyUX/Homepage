name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The coverage summary diffs against the push or pull request base.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=RequiresDocker" --collect:"XPlat Code Coverage" --results-directory coverage/cs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --coverage

      # Same base as the static checks: a manual run or a new branch diffs against origin/main (A-03.d).
      - name: Summarize coverage
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node ci/coverage-summary.mjs "$(find coverage/cs -name coverage.cobertura.xml | head -1)" coverage/js/coverage-summary.json --diff-base "$(node ci/push-base.mjs)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 14

  # The Jellyfin 12 line (ci/jellyfin-lines.json): the full xUnit suite against its declared minimum SDK,
  # on .NET 10. Coverage and Vitest run once, in build-test.
  build-test-12:
    name: Build & Test (Jellyfin 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore -p:JellyfinVersion=12.0.0

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:JellyfinVersion=12.0.0

      - name: Test
        run: dotnet test --no-build --configuration Release -p:JellyfinVersion=12.0.0 --filter "Category!=RequiresDocker"

  build-newest-abi:
    name: Build against the newest validated Jellyfin ${{ matrix.jellyfin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest validated server of each Jellyfin line (ci/jellyfin-lines.json "newest").
        include:
          - jellyfin: '10.11.11'
            dotnet: 9.0.x
          - jellyfin: '12.4.0'
            dotnet: 10.0.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}

      # The published builds target the declared minimum of each line (targetAbi); this one checks the
      # code still compiles against the newest server the line is validated on.
      - name: Build against Jellyfin ${{ matrix.jellyfin }}
        run: dotnet build src/Jellyfin.Plugin.JuxHomepage/Jellyfin.Plugin.JuxHomepage.csproj --configuration Release -p:JellyfinVersion=${{ matrix.jellyfin }}

  commits:
    name: Build every commit of the push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # HEAD gets the full suites in the other jobs; each earlier commit of the push is built and runs
      # Vitest, so no intermediate commit ships broken (TODO_V5 closure criterion c, CONTRIBUTING.md "Change Checklist").
      - name: Build and unit-test each commit before HEAD
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          BASE=$(node ci/push-base.mjs)
          FAILED=""
          LOCK=""
          for SHA in $(git rev-list --reverse "$BASE..$HEAD_SHA~1"); do
            echo "::group::$(git log -1 --format='%h %s' "$SHA")"
            git checkout -q --detach "$SHA"
            if [ "$(git rev-parse "$SHA:package-lock.json")" != "$LOCK" ]; then
              npm ci --no-audit --no-fund >/dev/null
              LOCK=$(git rev-parse "$SHA:package-lock.json")
            fi
            if dotnet build --configuration Release && npx vitest run; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$(git log -1 --format='%h %s' "$SHA") does not build or fails Vitest"
              FAILED="$FAILED $SHA"
            fi
          done
          git checkout -q --detach "$HEAD_SHA"
          [ -z "$FAILED" ]

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      # Commits checked: those of the pull request or of the push; without a usable "before" (manual run,
      # new branch), those since the merge base with origin/main (ci/push-base.mjs).
      - name: Run static checks
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node ci/static-checks.mjs --commits "$(node ci/push-base.mjs)..$HEAD_SHA"

      # Each check runs even when an earlier one failed, so one run reports every broken gate.
      - name: Check the client asset budget
        if: ${{ !cancelled() }}
        run: node ci/asset-budget.mjs

      - name: Check for dead code
        if: ${{ !cancelled() }}
        run: node ci/dead-code.mjs

  package:
    name: Build the plugin archive
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release version is read from the v* tags and the commits since the last one.
          fetch-depth: 0

      # One archive per Jellyfin line (ci/jellyfin-lines.json): .NET 9 for 10.11, .NET 10 for 12.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      # The version semantic-release gives this commit, or the last one when nothing is released: the
      # E2E installs the 10.11 archive and the release job publishes both as they are (CONTRIBUTING.md
      # "Change Checklist").
      - name: Compute the release version
        id: version
        run: |
          node ci/plugin-package.mjs next-version > next-version.txt
          cat next-version.txt
          cat next-version.txt >> "$GITHUB_OUTPUT"

      - name: Install JPRM
        run: pip install jprm

      # jellyux-homepage_X.Y.Z.10.zip and _X.Y.Z.12.zip (D-02); the output lists "<zip>=<sha256>" per zip.
      - name: Build the jprm archives
        id: archive
        run: |
          mkdir -p artifacts
          node ci/plugin-package.mjs build ${{ steps.version.outputs.version }} > archive.txt
          cat archive.txt
          cat archive.txt >> "$GITHUB_OUTPUT"
          sha256sum artifacts/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-zip
          path: artifacts/*.zip
          retention-days: 14

  e2e:
    name: End-to-end (Jellyfin ${{ matrix.jellyfin }})
    needs: [package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared minimum (build.yaml targetAbi) and the newest validated server.
        jellyfin: ['10.11.9', '10.11.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The archive of the package job, the one a release publishes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: plugin-zip

      # The 10.11 line's archive (X.Y.Z.10); the Jellyfin 12 archive has no E2E leg yet.
      - name: Show the installed archive
        run: sha256sum plugin-zip/*.10.zip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      # The browser is cached per Playwright version. --with-deps is not used: on ubuntu-latest every
      # library Chromium needs is already installed, and the extra fonts and upgrades it pulled from the
      # apt mirror took up to 11 min on some runners. The system dependencies are installed only when
      # Chromium fails to start.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: |
          npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            npx playwright install-deps chromium
          fi

      - name: Start the Jellyfin bench
        run: node e2e/setup.mjs up --image jellyfin/jellyfin:${{ matrix.jellyfin }} --plugin-zip "$(ls plugin-zip/*.10.zip)"

      - name: Run the browser tests
        run: npx playwright test -c e2e --project root --project mobile

      - name: Move the server under a BaseUrl
        run: node e2e/setup.mjs base-url /jf

      - name: Run the BaseUrl browser tests
        run: npx playwright test -c e2e --project baseurl

      - name: Load a configuration saved by the 2.13.0 release
        run: node e2e/setup.mjs load-config e2e/fixtures/config-2.13.0.xml

      - name: Run the configuration upgrade browser test
        run: npx playwright test -c e2e --project legacy-config

      - name: Dump the Jellyfin log
        if: failure()
        run: docker logs jux-e2e > e2e/.work/jellyfin.log 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report-${{ matrix.jellyfin }}
          path: |
            e2e/.work/report
            e2e/.work/results
            e2e/.work/jellyfin.log
          retention-days: 14

  drift:
    name: Jellyfin Web drift (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest validated server of each Jellyfin line, with the SDK and the drift tests of that line.
        include:
          - image: '10.11.11'
            sdk: '10.11.9'
            dotnet: 9.0.x
            filter: Category=RequiresDocker
          # COMPAT-02: the loadSections hook, .detailPageContent and the data-action=menu evidence are not
          # ported to the Jellyfin 12 bundle yet; their three drift tests are left out until they are.
          - image: '12.4'
            sdk: '12.0.0'
            dotnet: 10.0.x
            filter: Category=RequiresDocker&FullyQualifiedName!~LoadSectionsSplice_StillResolvesAgainstTheTargetBundle&FullyQualifiedName!~EveryInventoriedNativeToken_AppearsInTheTargetBundle&FullyQualifiedName!~EveryInventoriedAttributeValue_IsSetInTheTargetBundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet }}

      # The bundle the HookCardBuilder constant and Web/jux-native-selectors.json are validated for.
      - name: Extract jellyfin-web from jellyfin/jellyfin:${{ matrix.image }}
        run: |
          docker create --name jf-drift-extract jellyfin/jellyfin:${{ matrix.image }}
          WEB_DIR=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' jf-drift-extract | grep '^JELLYFIN_WEB_DIR=' | cut -d= -f2)
          docker cp "jf-drift-extract:$WEB_DIR" ./jellyfin-web-extract
          docker rm jf-drift-extract
          echo "JELLYFIN_WEB_EXTRACT_PATH=$PWD/jellyfin-web-extract" >> "$GITHUB_ENV"

      - name: Restore & build
        run: |
          dotnet restore -p:JellyfinVersion=${{ matrix.sdk }}
          dotnet build --configuration Release --no-restore -p:JellyfinVersion=${{ matrix.sdk }}

      - name: Run the drift checks
        run: dotnet test --no-build --configuration Release -p:JellyfinVersion=${{ matrix.sdk }} --filter "${{ matrix.filter }}"

  release:
    name: Release
    needs: [build-test, build-test-12, build-newest-abi, commits, static, package, e2e, drift]
    # Only a commit that calls for a release waits for the approval.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Waits for an approval of the "release" environment, given once the phase passed on the bench; one
    # publication at a time. A newer run reaching this job cancels an older one still pending (GitHub
    # concurrency): the older commits ship with the newer run.
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Published as is: ci/plugin-package.mjs verify (verifyReleaseCmd) checks its sha256 and version.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: artifacts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install JPRM
        run: pip install jprm

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: npx semantic-release
